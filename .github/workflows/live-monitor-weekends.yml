name: Live Match Automation Bot (Weekends)

on:
  schedule:
    # 1:00 PM IST (07:30 UTC) - Weekends
    - cron: '30 7 * * 0,6'

  # Allow manual triggering from the GitHub Actions UI just in case
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    # Allows the script to stay alive parsing updates for up to 12 hours (720 mins) 
    # to cover double-header t20 matches safely.
    timeout-minutes: 720 

    steps:
      - name: Checkout Repository Configuration
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r backend/requirements.txt

      - name: Run Live Monitor Engine
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_ROOM: ipl
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APP_MODE: prod
        run: python backend/monitor.py
