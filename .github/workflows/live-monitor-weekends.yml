name: Live Match Automation (Weekends)

on:
  schedule:
    # 1:00 PM IST (07:30 UTC) - Weekends
    - cron: '30 7 * * 0,6'

  # Allow manual triggering
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    # 12 hour timeout for double-headers
    timeout-minutes: 720

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r backend/requirements.txt

      - name: Run Live Monitor
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_ROOM: ipl
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          APP_MODE: prod
        run: |
          cd backend
          python -m automation.main run-scraper
          python -m automation.main match-status --sport cricket
