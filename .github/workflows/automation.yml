name: Automation Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/automation/**'
      - 'backend/scraper/**'
      - 'backend/scoring.py'

  workflow_dispatch:
    inputs:
      script:
        description: 'Script to execute'
        required: true
        type: choice
        options:
          - live-matches
          - run-scraper
          - match-status
          - auto-schedule
          - calculate-scores
          - update-leaderboard
      sport:
        description: 'Sport type'
        required: false
        default: 'cricket'
      tournament_id:
        description: 'Tournament ID'
        required: false
      match_id:
        description: 'Match ID'
        required: false
      environment:
        description: 'Environment mode'
        required: false
        default: 'prod'

jobs:
  run-automation:
    name: Run Automation Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
           
      - name: Run Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_MODE: ${{ inputs.environment || 'prod' }}
        run: |
          cd backend
          python -m automation.main ${{ inputs.script }} \
            --sport ${{ inputs.sport }} \
            ${{ inputs.tournament_id && format('--tournament-id {0}', inputs.tournament_id) || '' }} \
            ${{ inputs.match_id && format('--match-id {0}', inputs.match_id) || '' }}

  run-scheduler:
    name: Run Scheduler (Cron Jobs)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
           
      - name: Run Live Matches
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_MODE: prod
        run: |
          cd backend
          python -m automation.main live-matches --sport cricket
          
      - name: Run Scraper
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_MODE: prod
        run: |
          cd backend
          python -m automation.main run-scraper
          
      - name: Process Match Status
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_MODE: prod
        run: |
          cd backend
          python -m automation.main match-status --sport cricket
