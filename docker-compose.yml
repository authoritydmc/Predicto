version: '3.8'

services:
  monitor:
    build: .
    container_name: overlaychat-monitor
    env_file:
      - .env
    environment:
      - FIREBASE_ROOM=ipl
      - ENVIRONMENT=prod
    restart: unless-stopped
    # Uncomment the below if you want to mount a local service account JSON file
    # volumes:
    #   - ./service-account.json:/app/service-account.json:ro
    # environment:
    #   - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
