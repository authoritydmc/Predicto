<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Console</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0e27;
      color: #9c9c9c;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      overflow: hidden;
    }

    .debug-header {
      background: #0f1329;
      border-bottom: 1px solid #2a2e4e;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .debug-header h2 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
    }

    .debug-controls {
      display: flex;
      gap: 8px;
    }

    .debug-controls button {
      background: #2a2e4e;
      color: #9c9c9c;
      border: 1px solid #3a3e5e;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }

    .debug-controls button:hover {
      background: #3a3e5e;
      color: #fff;
    }

    #debugConsoleContent {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-entry {
      margin-bottom: 6px;
      display: flex;
      gap: 8px;
    }

    .log-timestamp {
      color: #555;
      flex-shrink: 0;
      min-width: 100px;
    }

    .log-level {
      color: #6699ff;
      flex-shrink: 0;
      min-width: 50px;
    }

    .log-message {
      flex: 1;
      word-break: break-all;
    }

    .log-log .log-message { color: #9c9c9c; }
    .log-info .log-message { color: #00d9ff; }
    .log-warn .log-message { color: #ffcc00; }
    .log-error .log-message { color: #ff4444; }

    /* Scrollbar styling */
    #debugConsoleContent::-webkit-scrollbar {
      width: 8px;
    }

    #debugConsoleContent::-webkit-scrollbar-track {
      background: #0f1329;
    }

    #debugConsoleContent::-webkit-scrollbar-thumb {
      background: #3a3e5e;
      border-radius: 4px;
    }

    #debugConsoleContent::-webkit-scrollbar-thumb:hover {
      background: #4a4e6e;
    }

    .debug-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div class="debug-container">
    <div class="debug-header">
      <h2>🖥️ Debug Console</h2>
      <div class="debug-controls">
        <button id="clearBtn">Clear Logs</button>
        <button id="pauseBtn">Pause</button>
      </div>
    </div>
    <div id="debugConsoleContent"></div>
  </div>

  <script>
    let logs = [];
    let isPaused = false;
    const maxLogs = 1000;
    let ws = null;

    const clearBtn = document.getElementById('clearBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const contentEl = document.getElementById('debugConsoleContent');

    clearBtn.addEventListener('click', () => {
      logs = [];
      contentEl.innerHTML = '';
    });

    pauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      pauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
      pauseBtn.style.background = isPaused ? '#4a3e2e' : '#2a2e4e';
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderLogs() {
      contentEl.innerHTML = logs.map(log => {
        const levelClass = `log-${log.level}`;
        const windowLabel = log.window ? ` <span style="color: #00d9ff;">[${log.window}]</span>` : '';
        return `<div class="log-entry ${levelClass}">
          <span class="log-timestamp">[${log.timestamp}]</span>
          <span class="log-level">[${log.level.toUpperCase()}]</span>
          ${windowLabel}
          <span class="log-message">${escapeHtml(log.message)}</span>
        </div>`;
      }).join('');

      // Scroll to top (latest logs first)
      contentEl.scrollTop = 0;
    }

    function connectWebSocket() {
      ws = new WebSocket('ws://localhost:9999');

      ws.onopen = () => {
        console.log('[Debug Window] WebSocket connected');
      };

      ws.onmessage = (event) => {
        try {
          const parsed = JSON.parse(event.data);

          if (parsed.type === 'logs-batch') {
            // Received batch of existing logs
            logs = parsed.data || [];
            renderLogs();
            console.log(`[Debug Window] Loaded ${logs.length} existing logs`);
          } else if (parsed.type === 'log') {
            // Received new log
            if (isPaused) return;
            
            const logEntry = parsed.data;
            logs.unshift(logEntry);
            if (logs.length > maxLogs) {
              logs.pop();
            }
            
            renderLogs();
          }
        } catch (err) {
          console.error('[Debug Window] Error parsing message:', err);
        }
      };

      ws.onerror = (error) => {
        console.error('[Debug Window] WebSocket error:', error);
      };

      ws.onclose = () => {
        console.log('[Debug Window] WebSocket disconnected, reconnecting in 3s...');
        setTimeout(connectWebSocket, 3000);
      };
    }

    // Connect to WebSocket on load
    connectWebSocket();

    console.log('[Debug Window] Initialized');
  </script>
</body>
</html>
